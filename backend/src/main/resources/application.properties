spring.application.name=consorcios
server.port=${PORT:8080}

# Carga backend/.env si existe (ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Base de datos (variables de entorno; ver backend/.env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/consorcios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo define database/schema-consorcios.sql; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dbo

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS (origen del frontend)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
